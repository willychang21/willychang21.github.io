name: Deploy to GitHub Pages

# Pull requests run the same checks (build, lint, tests, browser tests) without
# deploying, so a change to the pipeline is proven before it reaches main.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to the versions the lockfile and build are verified with; Vite 8 needs Node
      # 20.19 or newer, which ubuntu-latest does not guarantee. setup-node v7 runs on the
      # node24 action runtime (v4 used the deprecated node20). Its automatic package-manager
      # cache stays off: Bun installs, and this job holds Pages deploy permissions.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and test
        run: bun run lint && bun run test

      - name: Build
        run: bun run build

      - name: Verify build output
        run: bun run verify:build

      # Layout and interaction checks in a real browser, against the built site.
      - name: Install Chromium for browser tests
        run: bunx playwright install --with-deps chromium

      - name: Browser tests
        run: bun run test:e2e

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/'

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
